
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Тёмный коридор</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #030405;
      color: #eee;
      font-family: system-ui, sans-serif;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      z-index: 2;
      top: max(12px, env(safe-area-inset-top));
      left: 14px;
      color: white;
      font-size: 14px;
      text-shadow: 0 1px 5px black;
      pointer-events: none;
    }

    #lookArea {
      display: none;
      position: fixed;
      z-index: 3;
      inset: 0 0 0 32%;
      touch-action: none;
    }

    #joystick {
      display: none;
      position: fixed;
      z-index: 5;
      left: max(18px, env(safe-area-inset-left));
      bottom: max(22px, env(safe-area-inset-bottom));
      width: 142px;
      height: 142px;
      border: 2px solid rgba(255,255,255,.6);
      border-radius: 50%;
      background: rgba(25,30,35,.5);
      touch-action: none;
    }

    #stick {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 58px;
      height: 58px;
      margin: -29px 0 0 -29px;
      border: 2px solid white;
      border-radius: 50%;
      background: rgba(220,230,240,.5);
      pointer-events: none;
    }

    .touchButton {
      display: none;
      position: fixed;
      z-index: 6;
      place-items: center;
      border: 1px solid rgba(255,255,255,.8);
      background: rgba(15,18,22,.7);
      color: white;
      font: 700 14px system-ui, sans-serif;
      touch-action: none;
    }

    #runButton {
      right: max(20px, env(safe-area-inset-right));
      bottom: max(28px, env(safe-area-inset-bottom));
      width: 76px;
      height: 76px;
      border-radius: 50%;
    }

    #pauseButton {
      right: max(14px, env(safe-area-inset-right));
      top: max(14px, env(safe-area-inset-top));
      width: 46px;
      height: 46px;
      border-radius: 50%;
      font-size: 20px;
    }

    #overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(0,0,0,.84);
      text-align: center;
    }

    #panel {
      width: min(520px, 100%);
      padding: 24px;
      border: 1px solid #454545;
      background: #090a0c;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(28px, 7vw, 46px);
      letter-spacing: .08em;
    }

    #instructions {
      line-height: 1.6;
      color: #bbb;
    }

    #playButton {
      margin-top: 12px;
      padding: 13px 26px;
      border: 1px solid #ddd;
      background: #ddd;
      color: #111;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }

    #status {
      position: fixed;
      z-index: 12;
      left: 8px;
      bottom: 5px;
      max-width: calc(100% - 16px);
      padding: 5px 8px;
      background: rgba(0,0,0,.8);
      color: #ddd;
      font: 12px monospace;
      white-space: pre-wrap;
      pointer-events: none;
    }

    body.touch #lookArea,
    body.touch #joystick,
    body.touch #runButton,
    body.touch #pauseButton {
      display: block;
    }
  </style>
</head>

<body>
  <div id="hud">Найди выход. Не дай монстру тебя поймать.</div>
  <div id="lookArea"></div>

  <div id="joystick" aria-label="Джойстик движения">
    <div id="stick"></div>
  </div>
  <button id="runButton" class="touchButton" type="button">БЕГ</button>
  <button id="pauseButton" class="touchButton" type="button">Ⅱ</button>

  <div id="overlay">
    <div id="panel">
      <h1>ТЁМНЫЙ КОРИДОР</h1>
      <div id="instructions">Загрузка игры…</div>
      <button id="playButton" type="button">НАЧАТЬ</button>
    </div>
  </div>

  <div
